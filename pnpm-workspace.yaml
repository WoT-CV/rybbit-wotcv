packages:
  - client
  - server
  - shared

# Preserve the existing npm installs' explicit peer dependencies.
autoInstallPeers: false

# The v5.0.1 Zod adapter imports Zod without declaring its peer. With a strict
# workspace this otherwise resolves a hoisted backend Zod instead of the
# client's pinned version, causing incompatible types and deep instantiation.
packageExtensions:
  "@hookform/resolvers@5.0.1":
    peerDependencies:
      zod: "^3.24.4"

# These were previously npm overrides in the client and server manifests.
overrides:
  "@types/react": 19.2.7
  kysely: 0.28.17

# Native modules and build tools used by the apps.
allowBuilds:
  "@mongodb-js/zstd": true
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  fsevents: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
